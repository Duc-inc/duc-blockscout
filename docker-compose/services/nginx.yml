version: '3.9'

services:
  proxy:
    image: nginx
    container_name: proxy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - "../proxy:/etc/nginx/templates"
    environment:
      BACK_PROXY_PASS: ${BACK_PROXY_PASS:-http://backend:4000}
      FRONT_PROXY_PASS: ${FRONT_PROXY_PASS:-http://frontend:3000}
    # Bound to loopback only: a host-level nginx + certbot terminates TLS on
    # 80/443 and reverse-proxies here, same pattern as the pool dashboard.
    ports:
      - target: 80
        published: "8880"
        host_ip: 127.0.0.1
      - target: 8080
        published: "8888"
        host_ip: 127.0.0.1
      - target: 8081
        published: "8889"
        host_ip: 127.0.0.1
